<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#1f2937"
>

<title>My Budget</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  background: #f3f4f6;
  color: #1f2937;
}

.app {
  max-width: 500px;
  margin: auto;
  padding: 20px;
}

header {
  text-align: center;
  margin-bottom: 25px;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  color: #6b7280;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 22px;
  margin-bottom: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

button {
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 15px;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
}

.primary-button {
  background: #1f2937;
  color: white;
}

.secondary-button {
  background: #e5e7eb;
  color: #1f2937;
}

.danger-button {
  background: #fee2e2;
  color: #991b1b;
}

.hidden {
  display: none !important;
}

.balance {
  font-size: 38px;
  font-weight: 700;
  margin: 8px 0;
}

.subtext {
  color: #6b7280;
  font-size: 14px;
}

label {
  display: block;
  margin-top: 16px;
  margin-bottom: 6px;
  font-weight: 600;
}

input,
select {
  width: 100%;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 17px;
  background: white;
}

.error {
  color: #b91c1c;
  background: #fee2e2;
  padding: 12px;
  border-radius: 10px;
  margin-top: 15px;
}

.success {
  color: #166534;
  background: #dcfce7;
  padding: 12px;
  border-radius: 10px;
  margin-top: 15px;
}

.transaction {
  display: flex;
  justify-content: space-between;
  padding: 13px 0;
  border-bottom: 1px solid #e5e7eb;
}

.transaction:last-child {
  border-bottom: none;
}

.transaction-name {
  font-weight: 600;
}

.transaction-category {
  color: #6b7280;
  font-size: 13px;
  margin-top: 3px;
}

.transaction-amount {
  font-weight: 600;
}

</style>

</head>


<body>


<!-- ========================= -->
<!-- LOGIN -->
<!-- ========================= -->

<div
  class="app"
  id="loginScreen"
>

<header>

<h1>My Budget</h1>

<p>Sign in to continue</p>

</header>


<div class="card">

<label>
Email
</label>

<input
  type="email"
  id="loginEmail"
  placeholder="you@example.com"
  autocomplete="email"
>


<label>
Password
</label>

<input
  type="password"
  id="loginPassword"
  placeholder="Password"
  autocomplete="current-password"
>


<button
  class="primary-button"
  id="loginButton"
  style="margin-top:20px;"
>
Sign In
</button>


<div
  id="loginError"
  class="error hidden"
></div>

</div>

</div>


<!-- ========================= -->
<!-- APP -->
<!-- ========================= -->

<div
  class="app hidden"
  id="appScreen"
>


<header>

<h1>My Budget</h1>

<p id="currentDate"></p>

</header>


<div class="card">

<div class="subtext">
Needs
</div>

<div
  class="balance"
  id="needsBalance"
>
$0.00
</div>

<div class="subtext">
Available
</div>

</div>


<div class="card">

<div class="subtext">
Fun Money
</div>

<div
  class="balance"
  id="funBalance"
>
$0.00
</div>

<div class="subtext">
Available
</div>

</div>


<div class="card">

<div class="subtext">
Weekly Budget
</div>

<div
  class="balance"
  id="weeklyBudget"
>
$0.00
</div>

<div class="subtext">
This month's calculated weekly budget
</div>

</div>


<button
  class="primary-button"
  id="addExpenseButton"
>
+ Add Expense
</button>


<div
  class="card hidden"
  id="expenseForm"
>

<h2>Add Expense</h2>


<label>
Amount
</label>

<input
  type="number"
  id="expenseAmount"
  placeholder="0.00"
  step="0.01"
  min="0"
>


<label>
Use money from
</label>

<select id="expenseFund">

<option value="needs">
Needs
</option>

<option value="fun">
Fun Money
</option>

</select>


<label>
Description
</label>

<input
  type="text"
  id="expenseDescription"
  placeholder="Example: Walmart"
>


<button
  class="primary-button"
  id="saveExpenseButton"
  style="margin-top:20px;"
>
Save Expense
</button>


<button
  class="secondary-button"
  id="cancelExpenseButton"
  style="margin-top:10px;"
>
Cancel
</button>

</div>


<div class="card">

<h2>This Week</h2>

<div id="transactions">

<p class="subtext">
No expenses yet.
</p>

</div>

</div>


<button
  class="secondary-button"
  id="logoutButton"
>
Log Out
</button>


</div>


<script>


/* ================================= */
/* SUPABASE */
/* ================================= */


const SUPABASE_URL =
  "https://jivygwszzlaxnhhvxxsg.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_cZM-7AaU0xD6L_fMa_foOw_-Cjk2edj";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ================================= */
/* GLOBAL DATA */
/* ================================= */


let currentUser = null;

let householdId = null;

let balances = {

  needs: 0,

  fun: 0

};


/* ================================= */
/* ELEMENTS */
/* ================================= */


const loginScreen =
  document.getElementById(
    "loginScreen"
  );


const appScreen =
  document.getElementById(
    "appScreen"
  );


const loginError =
  document.getElementById(
    "loginError"
  );


/* ================================= */
/* MONEY */
/* ================================= */


function money(amount) {

  return Number(amount).toLocaleString(
    "en-US",
    {
      style: "currency",
      currency: "USD"
    }
  );

}


/* ================================= */
/* LOGIN */
/* ================================= */


document
  .getElementById("loginButton")
  .addEventListener(
    "click",
    login
  );


async function login() {

  loginError.classList.add(
    "hidden"
  );


  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();


  const password =
    document
      .getElementById("loginPassword")
      .value;


  if (!email || !password) {

    showLoginError(
      "Enter your email and password."
    );

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (error) {

    showLoginError(
      error.message
    );

    return;

  }


  currentUser =
    data.user;


  await startApp();

}


/* ================================= */
/* LOGIN ERROR */
/* ================================= */


function showLoginError(message) {

  loginError.textContent =
    message;

  loginError.classList.remove(
    "hidden"
  );

}


/* ================================= */
/* START APP */
/* ================================= */


async function startApp() {


  loginScreen.classList.add(
    "hidden"
  );


  appScreen.classList.remove(
    "hidden"
  );


  document.getElementById(
    "currentDate"
  ).textContent =
    new Date().toLocaleDateString(
      "en-US",
      {
        month: "long",
        day: "numeric",
        year: "numeric"
      }
    );


  await loadHousehold();

}


/* ================================= */
/* LOAD HOUSEHOLD */
/* ================================= */


async function loadHousehold() {


  const {
    data,
    error
  } =
    await supabaseClient
      .from("household_members")
      .select("household_id")
      .eq(
        "user_id",
        currentUser.id
      )
      .limit(1)
      .maybeSingle();


  if (error) {

    alert(
      "Could not load household: "
      + error.message
    );

    return;

  }


  if (!data) {

    alert(
      "This account is not connected to a household."
    );

    return;

  }


  householdId =
    data.household_id;


  await loadBalance();

  await loadExpenses();

}


/* ================================= */
/* LOAD BALANCE */
/* ================================= */


async function loadBalance() {


  const {
    data,
    error
  } =
    await supabaseClient
      .from("balances")
      .select("*")
      .eq(
        "household_id",
        householdId
      )
      .maybeSingle();


  if (error) {

    console.error(error);

    return;

  }


  if (!data) {

    const {
      data: newBalance,
      error: insertError
    } =
      await supabaseClient
        .from("balances")
        .insert({

          household_id:
            householdId,

          needs_balance:
            0,

          fun_balance:
            0

        })
        .select()
        .single();


    if (insertError) {

      alert(
        "Could not create balance: "
        + insertError.message
      );

      return;

    }


    balances.needs =
      Number(
        newBalance.needs_balance
      );


    balances.fun =
      Number(
        newBalance.fun_balance
      );


  } else {


    balances.needs =
      Number(
        data.needs_balance
      );


    balances.fun =
      Number(
        data.fun_balance
      );

  }


  updateBalances();

}


/* ================================= */
/* SAVE BALANCE */
/* ================================= */


async function saveBalance() {


  const {
    error
  } =
    await supabaseClient
      .from("balances")
      .update({

        needs_balance:
          balances.needs,

        fun_balance:
          balances.fun

      })
      .eq(
        "household_id",
        householdId
      );


  if (error) {

    alert(
      "Could not save balance: "
      + error.message
    );

  }

}


/* ================================= */
/* UPDATE BALANCES */
/* ================================= */


function updateBalances() {


  document.getElementById(
    "needsBalance"
  ).textContent =
    money(
      balances.needs
    );


  document.getElementById(
    "funBalance"
  ).textContent =
    money(
      balances.fun
    );

}


/* ================================= */
/* LOAD EXPENSES */
/* ================================= */


async function loadExpenses() {


  const {
    data,
    error
  } =
    await supabaseClient
      .from("expenses")
      .select("*")
      .eq(
        "household_id",
        householdId
      )
      .order(
        "spent_at",
        {
          ascending: false
        }
      )
      .limit(50);


  if (error) {

    console.error(error);

    return;

  }


  const container =
    document.getElementById(
      "transactions"
    );


  if (!data || data.length === 0) {

    container.innerHTML =
      '<p class="subtext">No expenses yet.</p>';

    return;

  }


  container.innerHTML = "";


  data.forEach(
    function(expense) {


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "transaction";


      row.innerHTML = `

        <div>

          <div class="transaction-name">

            ${escapeHtml(
              expense.description
            )}

          </div>

          <div class="transaction-category">

            ${
              expense.fund === "needs"
                ? "Needs"
                : "Fun Money"
            }

          </div>

        </div>


        <div class="transaction-amount">

          -${money(
            expense.amount
          )}

        </div>

      `;


      container.appendChild(
        row
      );

    }
  );

}


/* ================================= */
/* ADD EXPENSE */
/* ================================= */


document
  .getElementById(
    "addExpenseButton"
  )
  .addEventListener(
    "click",
    function() {

      document
        .getElementById(
          "expenseForm"
        )
        .classList
        .remove("hidden");

    }
  );


document
  .getElementById(
    "cancelExpenseButton"
  )
  .addEventListener(
    "click",
    function() {

      document
        .getElementById(
          "expenseForm"
        )
        .classList
        .add("hidden");

    }
  );


document
  .getElementById(
    "saveExpenseButton"
  )
  .addEventListener(
    "click",
    addExpense
  );


async function addExpense() {


  const amount =
    Number(
      document
        .getElementById(
          "expenseAmount"
        )
        .value
    );


  const fund =
    document
      .getElementById(
        "expenseFund"
      )
      .value;


  const description =
    document
      .getElementById(
        "expenseDescription"
      )
      .value
      .trim();


  if (
    !amount ||
    amount <= 0
  ) {

    alert(
      "Enter an amount."
    );

    return;

  }


  if (!description) {

    alert(
      "Enter a description."
    );

    return;

  }


  /* Update local balance */

  if (fund === "needs") {

    balances.needs -=
      amount;

  } else {

    balances.fun -=
      amount;

  }


  /* Save expense */

  const {
    error
  } =
    await supabaseClient
      .from("expenses")
      .insert({

        household_id:
          householdId,

        user_id:
          currentUser.id,

        amount:
          amount,

        fund:
          fund,

        description:
          description

      });


  if (error) {

    alert(
      "Could not save expense: "
      + error.message
    );

    await loadBalance();

    return;

  }


  await saveBalance();


  updateBalances();


  await loadExpenses();


  document.getElementById(
    "expenseAmount"
  ).value = "";


  document.getElementById(
    "expenseDescription"
  ).value = "";


  document
    .getElementById(
      "expenseForm"
    )
    .classList
    .add("hidden");

}


/* ================================= */
/* LOGOUT */
/* ================================= */


document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    async function() {

      await supabaseClient.auth.signOut();

      appScreen.classList.add(
        "hidden"
      );

      loginScreen.classList.remove(
        "hidden"
      );

    }
  );


/* ================================= */
/* HTML SAFETY */
/* ================================= */


function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value;

  return div.innerHTML;

}


/* ================================= */
/* CHECK EXISTING LOGIN */
/* ================================= */


async function checkSession() {


  const {
    data
  } =
    await supabaseClient.auth.getSession();


  if (
    data &&
    data.session &&
    data.session.user
  ) {

    currentUser =
      data.session.user;

    await startApp();

  }

}


checkSession();

</script>

</body>

</html>
