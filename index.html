<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#1f2937">

<title>My Budget</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  background: #f3f4f6;
  color: #1f2937;
}

.app {
  max-width: 500px;
  margin: auto;
  padding: 20px;
}

header {
  text-align: center;
  margin-bottom: 25px;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  color: #6b7280;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 22px;
  margin-bottom: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

button {
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 14px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.primary-button {
  background: #1f2937;
  color: white;
}

.secondary-button {
  background: #e5e7eb;
  color: #1f2937;
}

.danger-button {
  background: #fee2e2;
  color: #991b1b;
}

.small-button {
  width: auto;
  padding: 7px 11px;
  font-size: 13px;
  border-radius: 8px;
}

.hidden {
  display: none !important;
}

.balance {
  font-size: 38px;
  font-weight: 700;
  margin: 8px 0;
}

.subtext {
  color: #6b7280;
  font-size: 14px;
}

label {
  display: block;
  margin-top: 16px;
  margin-bottom: 6px;
  font-weight: 600;
}

input,
select {
  width: 100%;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 17px;
  background: white;
}

.error {
  color: #b91c1c;
  background: #fee2e2;
  padding: 12px;
  border-radius: 10px;
  margin-top: 15px;
}

.transaction {
  padding: 15px 0;
  border-bottom: 1px solid #e5e7eb;
}

.transaction:last-child {
  border-bottom: none;
}

.transaction-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.transaction-name {
  font-weight: 600;
}

.transaction-category {
  color: #6b7280;
  font-size: 13px;
  margin-top: 3px;
}

.transaction-amount {
  font-weight: 600;
  white-space: nowrap;
}

.transaction-actions {
  display: flex;
  gap: 8px;
  margin-top: 9px;
}

.transaction-actions button {
  flex: 0 0 auto;
}

</style>

</head>

<body>


<!-- ========================= -->
<!-- LOGIN -->
<!-- ========================= -->

<div
  class="app"
  id="loginScreen"
>

<header>

<h1>My Budget</h1>

<p>Sign in to continue</p>

</header>

<div class="card">

<label>Email</label>

<input
  type="email"
  id="loginEmail"
  placeholder="you@example.com"
  autocomplete="email"
>

<label>Password</label>

<input
  type="password"
  id="loginPassword"
  placeholder="Password"
  autocomplete="current-password"
>

<button
  class="primary-button"
  id="loginButton"
  style="margin-top:20px;"
>
Sign In
</button>

<div
  id="loginError"
  class="error hidden"
></div>

</div>

</div>


<!-- ========================= -->
<!-- APP -->
<!-- ========================= -->

<div
  class="app hidden"
  id="appScreen"
>

<header>

<h1>My Budget</h1>

<p id="currentDate"></p>

</header>


<div class="card">

<div class="subtext">
Needs
</div>

<div
  class="balance"
  id="needsBalance"
>
$0.00
</div>

<div class="subtext">
Available
</div>

</div>


<div class="card">

<div class="subtext">
Fun Money
</div>

<div
  class="balance"
  id="funBalance"
>
$0.00
</div>

<div class="subtext">
Available
</div>

</div>


<div class="card">

<div class="subtext">
Weekly Budget
</div>

<div
  class="balance"
  id="weeklyBudget"
>
$0.00
</div>

<div class="subtext">
This month's calculated weekly budget
</div>

</div>


<button
  class="primary-button"
  id="addExpenseButton"
>
+ Add Expense
</button>


<!-- ========================= -->
<!-- EXPENSE FORM -->
<!-- ========================= -->

<div
  class="card hidden"
  id="expenseForm"
>

<h2 id="expenseFormTitle">
Add Expense
</h2>

<label>Amount</label>

<input
  type="number"
  id="expenseAmount"
  placeholder="0.00"
  step="0.01"
  min="0"
>

<label>Use money from</label>

<select id="expenseFund">

<option value="needs">
Needs
</option>

<option value="fun">
Fun Money
</option>

</select>

<label>Description</label>

<input
  type="text"
  id="expenseDescription"
  placeholder="Example: Walmart"
>

<button
  class="primary-button"
  id="saveExpenseButton"
  style="margin-top:20px;"
>
Save Expense
</button>

<button
  class="secondary-button"
  id="cancelExpenseButton"
  style="margin-top:10px;"
>
Cancel
</button>

</div>


<!-- ========================= -->
<!-- TRANSACTIONS -->
<!-- ========================= -->

<div class="card">

<h2>This Week</h2>

<div id="transactions">

<p class="subtext">
No expenses yet.
</p>

</div>

</div>


<button
  class="secondary-button"
  id="logoutButton"
>
Log Out
</button>

</div>


<script>


/* ================================= */
/* SUPABASE CONNECTION */
/* ================================= */

const SUPABASE_URL =
  "https://jivygwszzlaxnhhvxxsg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_cZM-7AaU0xD6L_fMa_foOw_-Cjk2edj";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ================================= */
/* GLOBAL VARIABLES */
/* ================================= */

let currentUser = null;

let householdId = null;

let editingExpenseId = null;


/* ================================= */
/* ELEMENTS */
/* ================================= */

const loginScreen =
  document.getElementById(
    "loginScreen"
  );

const appScreen =
  document.getElementById(
    "appScreen"
  );

const loginError =
  document.getElementById(
    "loginError"
  );


/* ================================= */
/* MONEY FORMAT */
/* ================================= */

function money(amount) {

  return Number(amount).toLocaleString(
    "en-US",
    {
      style: "currency",
      currency: "USD"
    }
  );

}


/* ================================= */
/* LOGIN */
/* ================================= */

document
  .getElementById("loginButton")
  .addEventListener(
    "click",
    login
  );


async function login() {

  loginError.classList.add(
    "hidden"
  );

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  if (!email || !password) {

    showLoginError(
      "Enter your email and password."
    );

    return;

  }

  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });

  if (error) {

    showLoginError(
      error.message
    );

    return;

  }

  currentUser =
    data.user;

  await startApp();

}


/* ================================= */
/* LOGIN ERROR */
/* ================================= */

function showLoginError(message) {

  loginError.textContent =
    message;

  loginError.classList.remove(
    "hidden"
  );

}


/* ================================= */
/* START APP */
/* ================================= */

async function startApp() {

  loginScreen.classList.add(
    "hidden"
  );

  appScreen.classList.remove(
    "hidden"
  );

  document.getElementById(
    "currentDate"
  ).textContent =
    new Date().toLocaleDateString(
      "en-US",
      {
        month: "long",
        day: "numeric",
        year: "numeric"
      }
    );

  await loadHousehold();

}


/* ================================= */
/* LOAD HOUSEHOLD */
/* ================================= */

async function loadHousehold() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("household_members")
      .select("household_id")
      .eq(
        "user_id",
        currentUser.id
      )
      .limit(1)
      .maybeSingle();

  if (error) {

    alert(
      "Could not load household: "
      + error.message
    );

    return;

  }

  if (!data) {

    alert(
      "This account is not connected to a household."
    );

    return;

  }

  householdId =
    data.household_id;

  await loadBudget();

  await loadExpenses();

}


/* ================================= */
/* LOAD BUDGET */
/* ================================= */

async function loadBudget() {

  const firstOfMonth =
    new Date();

  firstOfMonth.setDate(1);

  const month =
    firstOfMonth
      .toISOString()
      .split("T")[0];

  const {
    data,
    error
  } =
    await supabaseClient
      .from("budgets")
      .select("*")
      .eq(
        "household_id",
        householdId
      )
      .eq(
        "month",
        month
      )
      .maybeSingle();

  if (error) {

    console.error(error);

    return;

  }

  if (data) {

    document.getElementById(
      "weeklyBudget"
    ).textContent =
      money(
        data.weekly_budget
      );

  }

}


/* ================================= */
/* GET START OF WEEK */
/* ================================= */

function getWeekStart(date) {

  const d =
    new Date(date);

  const day =
    d.getDay();

  const difference =
    day === 0
      ? -6
      : 1 - day;

  d.setDate(
    d.getDate() + difference
  );

  d.setHours(
    0, 0, 0, 0
  );

  return d
    .toISOString()
    .split("T")[0];

}


/* ================================= */
/* CALCULATE BALANCES */
/* ================================= */

async function calculateBalances() {

  const {
    data: deposits,
    error: depositError
  } =
    await supabaseClient
      .from("allowance_deposits")
      .select("fund, amount")
      .eq(
        "household_id",
        householdId
      );

  if (depositError) {

    console.error(
      depositError
    );

    return;

  }


  const {
    data: expenses,
    error: expenseError
  } =
    await supabaseClient
      .from("expenses")
      .select("fund, amount")
      .eq(
        "household_id",
        householdId
      );

  if (expenseError) {

    console.error(
      expenseError
    );

    return;

  }


  let needs =
    0;

  let fun =
    0;


  deposits.forEach(
    function(deposit) {

      if (
        deposit.fund === "needs"
      ) {

        needs +=
          Number(
            deposit.amount
          );

      }

      if (
        deposit.fund === "fun"
      ) {

        fun +=
          Number(
            deposit.amount
          );

      }

    }
  );


  expenses.forEach(
    function(expense) {

      if (
        expense.fund === "needs"
      ) {

        needs -=
          Number(
            expense.amount
          );

      }

      if (
        expense.fund === "fun"
      ) {

        fun -=
          Number(
            expense.amount
          );

      }

    }
  );


  document.getElementById(
    "needsBalance"
  ).textContent =
    money(needs);


  document.getElementById(
    "funBalance"
  ).textContent =
    money(fun);

}


/* ================================= */
/* LOAD EXPENSES */
/* ================================= */

async function loadExpenses() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("expenses")
      .select("*")
      .eq(
        "household_id",
        householdId
      )
      .order(
        "spent_at",
        {
          ascending: false
        }
      )
      .limit(50);

  if (error) {

    console.error(error);

    return;

  }


  const container =
    document.getElementById(
      "transactions"
    );


  if (
    !data ||
    data.length === 0
  ) {

    container.innerHTML =
      '<p class="subtext">No expenses yet.</p>';

    await calculateBalances();

    return;

  }


  container.innerHTML =
    "";


  data.forEach(
    function(expense) {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "transaction";


      row.innerHTML = `

        <div class="transaction-top">

          <div>

            <div class="transaction-name">

              ${escapeHtml(
                expense.description
              )}

            </div>

            <div class="transaction-category">

              ${
                expense.fund === "needs"
                  ? "Needs"
                  : "Fun Money"
              }

            </div>

          </div>

          <div class="transaction-amount">

            -${money(
              expense.amount
            )}

          </div>

        </div>


        <div class="transaction-actions">

          <button
            class="secondary-button small-button"
            onclick="editExpense('${expense.id}')"
          >
            Edit
          </button>

          <button
            class="danger-button small-button"
            onclick="deleteExpense('${expense.id}')"
          >
            Delete
          </button>

        </div>

      `;


      container.appendChild(
        row
      );

    }
  );


  await calculateBalances();

}


/* ================================= */
/* ADD EXPENSE BUTTON */
/* ================================= */

document
  .getElementById(
    "addExpenseButton"
  )
  .addEventListener(
    "click",
    function() {

      editingExpenseId =
        null;

      document.getElementById(
        "expenseFormTitle"
      ).textContent =
        "Add Expense";

      document.getElementById(
        "saveExpenseButton"
      ).textContent =
        "Save Expense";

      document
        .getElementById(
          "expenseForm"
        )
        .classList
        .remove(
          "hidden"
        );

    }
  );


/* ================================= */
/* CANCEL EXPENSE */
/* ================================= */

document
  .getElementById(
    "cancelExpenseButton"
  )
  .addEventListener(
    "click",
    closeExpenseForm
  );


function closeExpenseForm() {

  editingExpenseId =
    null;

  document.getElementById(
    "expenseAmount"
  ).value = "";

  document.getElementById(
    "expenseDescription"
  ).value = "";

  document.getElementById(
    "expenseFund"
  ).value =
    "needs";

  document
    .getElementById(
      "expenseForm"
    )
    .classList
    .add(
      "hidden"
    );

}


/* ================================= */
/* SAVE EXPENSE */
/* ================================= */

document
  .getElementById(
    "saveExpenseButton"
  )
  .addEventListener(
    "click",
    saveExpense
  );


async function saveExpense() {

  const amount =
    Number(
      document
        .getElementById(
          "expenseAmount"
        )
        .value
    );

  const fund =
    document
      .getElementById(
        "expenseFund"
      )
      .value;

  const description =
    document
      .getElementById(
        "expenseDescription"
      )
      .value
      .trim();


  if (
    !amount ||
    amount <= 0
  ) {

    alert(
      "Enter an amount."
    );

    return;

  }


  if (!description) {

    alert(
      "Enter a description."
    );

    return;

  }


  /* EDIT */

  if (editingExpenseId) {

    const {
      error
    } =
      await supabaseClient
        .from("expenses")
        .update({

          amount:
            amount,

          fund:
            fund,

          description:
            description,

          updated_at:
            new Date().toISOString()

        })
        .eq(
          "id",
          editingExpenseId
        );


    if (error) {

      alert(
        "Could not update expense: "
        + error.message
      );

      return;

    }


  }


  /* ADD */

  else {

    const {
      error
    } =
      await supabaseClient
        .from("expenses")
        .insert({

          household_id:
            householdId,

          user_id:
            currentUser.id,

          amount:
            amount,

          fund:
            fund,

          description:
            description

        });


    if (error) {

      alert(
        "Could not save expense: "
        + error.message
      );

      return;

    }

  }


  closeExpenseForm();

  await loadExpenses();

}


/* ================================= */
/* EDIT EXPENSE */
/* ================================= */

async function editExpense(id) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("expenses")
      .select("*")
      .eq(
        "id",
        id
      )
      .single();


  if (error) {

    alert(
      "Could not load expense: "
      + error.message
    );

    return;

  }


  editingExpenseId =
    id;


  document.getElementById(
    "expenseFormTitle"
  ).textContent =
    "Edit Expense";


  document.getElementById(
    "saveExpenseButton"
  ).textContent =
    "Save Changes";


  document.getElementById(
    "expenseAmount"
  ).value =
    data.amount;


  document.getElementById(
    "expenseFund"
  ).value =
    data.fund;


  document.getElementById(
    "expenseDescription"
  ).value =
    data.description;


  document
    .getElementById(
      "expenseForm"
    )
    .classList
    .remove(
      "hidden"
    );


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* ================================= */
/* DELETE EXPENSE */
/* ================================= */

async function deleteExpense(id) {

  const confirmed =
    confirm(
      "Delete this expense?"
    );


  if (!confirmed) {

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("expenses")
      .delete()
      .eq(
        "id",
        id
      );


  if (error) {

    alert(
      "Could not delete expense: "
      + error.message
    );

    return;

  }


  await loadExpenses();

}


/* ================================= */
/* LOGOUT */
/* ================================= */

document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    async function() {

      await supabaseClient.auth.signOut();

      appScreen.classList.add(
        "hidden"
      );

      loginScreen.classList.remove(
        "hidden"
      );

    }
  );


/* ================================= */
/* HTML SAFETY */
/* ================================= */

function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value;

  return div.innerHTML;

}


/* ================================= */
/* CHECK EXISTING SESSION */
/* ================================= */

async function checkSession() {

  const {
    data
  } =
    await supabaseClient.auth.getSession();


  if (
    data &&
    data.session &&
    data.session.user
  ) {

    currentUser =
      data.session.user;

    await startApp();

  }

}


checkSession();

</script>

</body>

</html>
