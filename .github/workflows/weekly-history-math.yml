name: Add weekly history math breakdown
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch weekly history math
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          old = '''list.innerHTML=rows.map(row=>{\nconst activity=(row.activity||[]).map(item=>{\nconst d=parseLocalDate(item.date);\nconst dateText=d.toLocaleDateString("en-US",{month:"numeric",day:"numeric"});\nconst positive=item.kind==="adjustment";\nreturn `<div class="week-history-ledger-row"><div class="week-history-ledger-main"><span class="week-history-ledger-date">${escapeHtml(dateText)}</span><span class="week-history-ledger-name">${escapeHtml(item.description)}</span></div><div class="week-history-ledger-amount ${positive?"positive":""}">${positive?"+":"-"}${money(item.amount)}</div></div>`;\n}).join("");\nreturn `\n<div class="week-history-row">\n<div class="week-history-dates">${escapeHtml(formatWeekRange(row.week_start,row.week_end))}</div>\n<div class="week-history-topline">\n<div><div class="week-history-start-label">Starting Value</div><div class="subtext">Includes weekly deposit of ${money(row.weekly_deposit)}</div></div>\n<div class="week-history-start-amount">${money(row.starting_balance)}</div>\n</div>\n<div class="week-history-ledger">${activity||'<div class="week-history-empty">No expenses or added funds this week.</div>'}</div>\n<div class="week-history-remainder"><span>Remainder</span><strong>${money(row.ending_balance)}</strong></div>\n</div>`;\n}).join("");'''
          new = '''list.innerHTML=rows.map(row=>{\nconst carryover=Number(row.starting_balance||0)-Number(row.weekly_deposit||0);\nconst allowanceLabel=fund==="needs"?"Needs Money allowance for this week":"Fun Money allowance for this week";\nconst activity=(row.activity||[]).map(item=>{\nconst d=parseLocalDate(item.date);\nconst dateText=d.toLocaleDateString("en-US",{month:"numeric",day:"numeric"});\nconst positive=item.kind==="adjustment";\nreturn `<div class="week-history-ledger-row"><div class="week-history-ledger-main"><span class="week-history-ledger-date">${escapeHtml(dateText)}</span><span class="week-history-ledger-name">${escapeHtml(item.description)}</span></div><div class="week-history-ledger-amount ${positive?"positive":""}">${positive?"+":"-"}${money(item.amount)}</div></div>`;\n}).join("");\nreturn `\n<div class="week-history-row">\n<div class="week-history-dates">${escapeHtml(formatWeekRange(row.week_start,row.week_end))}</div>\n<div style="margin:12px 0 14px;padding:12px;border:1px solid color-mix(in srgb,var(--edge) 72%,transparent);border-radius:10px;background:color-mix(in srgb,var(--panel) 94%,var(--edge))">\n<div class="budget-summary-row"><span>Carryover from previous week</span><strong>${money(carryover)}</strong></div>\n<div class="budget-summary-row"><span>${escapeHtml(allowanceLabel)}</span><strong>+${money(row.weekly_deposit)}</strong></div>\n<div style="border-top:1px solid color-mix(in srgb,var(--edge) 72%,transparent);margin:8px 0"></div>\n<div class="budget-summary-row"><span>Total starting for this week</span><strong>${money(row.starting_balance)}</strong></div>\n<div class="subtext" style="margin-top:7px;text-align:right">${money(carryover)} + ${money(row.weekly_deposit)} = ${money(row.starting_balance)}</div>\n</div>\n<div class="week-history-ledger">${activity||'<div class="week-history-empty">No expenses or added funds this week.</div>'}</div>\n<div class="week-history-remainder"><span>Remainder</span><strong>${money(row.ending_balance)}</strong></div>\n</div>`;\n}).join("");'''
          if old not in s:
              if new in s:
                  print("Already patched")
              else:
                  raise SystemExit("Expected weekly history block not found; refusing to modify index.html")
          else:
              p.write_text(s.replace(old, new, 1))
              print("Patched index.html")
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/weekly-history-math.yml
          git add index.html
          git commit -m "Show weekly carryover and allowance math" || exit 0
          git push
