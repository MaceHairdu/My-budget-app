name: Fix iOS UI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-ios-ui.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch iOS UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">', '<meta name="apple-mobile-web-app-status-bar-style" content="default">')
          marker = '</style>'
          css = r'''
          /* iOS 27: keep the app crisp and prevent accidental text selection/callouts. */
          html, body, #mainWorkspace, .mobile-track, .workspace-panel, .panel, .panel-inner {
            -webkit-backdrop-filter: none !important;
            backdrop-filter: none !important;
            filter: none !important;
          }
          html, body, #mainWorkspace, .mobile-track, .workspace-panel,
          .panel, .panel-inner, .fund-card, .fund-card * {
            -webkit-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
          }
          input, textarea, select {
            -webkit-user-select: text !important;
            user-select: text !important;
            -webkit-touch-callout: default !important;
          }
          '''
          if '/* iOS 27: keep the app crisp' not in s:
              s = s.replace(marker, css + '\n' + marker, 1)
          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix iOS top blur and disable text selection"
          git push
