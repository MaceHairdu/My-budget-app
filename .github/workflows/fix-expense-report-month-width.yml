name: Fix expense report month width
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch month field width
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='/* expense-report-month-width-fix */'
          css='''\n/* expense-report-month-width-fix */\n#expenseReportSettings{\n  min-width:0;\n  overflow-x:hidden;\n}\n#expenseReportMonth{\n  display:block;\n  width:100%;\n  max-width:100%;\n  min-width:0;\n  box-sizing:border-box;\n  margin:0;\n  -webkit-appearance:none;\n  appearance:none;\n  text-align:center;\n}\n'''
          if marker not in s:
              if '</style>' not in s:
                  raise SystemExit('No </style> tag found; refusing to modify index.html')
              s=s.replace('</style>', css+'\n</style>', 1)
              p.write_text(s)
              print('Patched index.html')
          else:
              print('Already patched')
      - name: Commit patch if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Fix monthly expense report month field width"
            git push
          fi
      - name: Remove temporary workflow
        if: always()
        run: |
          git pull --rebase || true
          git rm .github/workflows/fix-expense-report-month-width.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary expense report month width workflow" || exit 0
          git push
