name: Fix iOS safe area directly

on:
  push:
    paths:
      - '.github/workflows/fix-ios-safe-area-direct.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch iOS viewport and layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">'
          new = '<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">'
          if old in s:
              s = s.replace(old, new, 1)
          # Fix the actual workspace sizing. Top/bottom safe-area padding keeps the panel out of iOS edge effects.
          s = s.replace('#mainWorkspace{\nwidth:100%;height:100vh;padding:12px;overflow:hidden\n}', '#mainWorkspace{\nwidth:100%;\nheight:100dvh;\npadding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));\noverflow:hidden\n}', 1)
          s = s.replace('.workspace-panel{\nwidth:100%;min-width:0;height:calc(100vh - 24px);min-height:0\n}', '.workspace-panel{\nwidth:100%;min-width:0;height:100%;min-height:0\n}', 1)
          # Keep fixed gear aligned with the safe-area-adjusted panel.
          s = s.replace('.settings-gear{position:fixed;z-index:500;top:15px;', '.settings-gear{position:fixed;z-index:500;top:calc(15px + env(safe-area-inset-top));', 1)
          p.write_text(s)
          PY
      - name: Verify patch
        run: |
          grep -q 'viewport-fit=cover' index.html
          grep -q 'height:100dvh' index.html
          grep -q 'safe-area-inset-top' index.html
          if grep -q 'height:100vh;padding:12px' index.html; then exit 1; fi
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix iOS top blur and bottom safe-area layout'
          git push
