name: Patch Bicycle Budget index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-index.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          login_old = '''<button class="secondary-button" id="forgotPasswordButton" style="width:100%;margin-top:11px">
          Forgot Password?
          </button>
          <div id="loginError" class="login-error hidden"></div>'''
          login_new = '''<button class="secondary-button" id="forgotPasswordButton" style="width:100%;margin-top:11px">
          Forgot Password?
          </button>
          <button class="secondary-button" id="createAccountButton" style="width:100%;margin-top:11px">
          Create Account
          </button>
          <div id="loginError" class="login-error hidden"></div>'''
          if login_old not in text:
              raise SystemExit('Expected login markup not found; refusing to modify index.html')
          text = text.replace(login_old, login_new, 1)

          replacements = [
              ('const historical=HISTORICAL_BUDGETS[monthKey]||null;', 'const historical=householdId===LEGACY_SOFT_BUDGET_HOUSEHOLD_ID?(HISTORICAL_BUDGETS[monthKey]||null):null;', 2),
              ('const historical=HISTORICAL_BUDGETS[previousKey]||null;', 'const historical=householdId===LEGACY_SOFT_BUDGET_HOUSEHOLD_ID?(HISTORICAL_BUDGETS[previousKey]||null):null;', 1),
              ('const historical=HISTORICAL_BUDGETS[month]||null;', 'const historical=householdId===LEGACY_SOFT_BUDGET_HOUSEHOLD_ID?(HISTORICAL_BUDGETS[month]||null):null;', 1),
          ]
          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'Expected {expected} occurrence(s) of {old!r}, found {actual}; refusing to modify index.html')
              text = text.replace(old, new, expected)

          js_old = '''document
          .getElementById("loginButton")
          .onclick=
          login;'''
          js_new = '''document
          .getElementById("loginButton")
          .onclick=
          login;
          document
          .getElementById("createAccountButton")
          .onclick=
          ()=>{location.href="./signup.html";};'''
          if js_old not in text:
              raise SystemExit('Expected login handler not found; refusing to modify index.html')
          text = text.replace(js_old, js_new, 1)

          path.write_text(text)
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-index.yml
          git add index.html
          git commit -m "Wire Create Account and isolate legacy budget history"
          git push origin main
