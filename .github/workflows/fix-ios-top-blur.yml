name: Fix iOS viewport safe areas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ios-top-blur.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix iOS safe areas and dynamic viewport height
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          old = 'width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'
          new = 'width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'
          if old in s and 'viewport-fit=cover' not in s:
              s = s.replace(old, new, 1)

          s = s.replace('#mainWorkspace{\nwidth:100%;height:100vh;padding:12px;overflow:hidden\n}', '''#mainWorkspace{
width:100%;
height:100dvh;
padding-top:max(12px, env(safe-area-inset-top));
padding-right:max(12px, env(safe-area-inset-right));
padding-bottom:max(12px, env(safe-area-inset-bottom));
padding-left:max(12px, env(safe-area-inset-left));
overflow:hidden
}''', 1)

          s = s.replace('.workspace-panel{\nwidth:100%;min-width:0;height:calc(100vh - 24px);min-height:0\n}', '''.workspace-panel{
width:100%;
min-width:0;
height:100%;
min-height:0
}''', 1)

          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix iOS safe-area blur and bottom overflow"
          git push
