name: Fix iOS 27 scroll edge
on:
  push:
    paths:
      - '.github/workflows/fix-ios27-scroll-edge.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch iOS 27 scroll edge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''\n/* v34 iOS 27: suppress WebKit's automatic top scroll-edge blur.\n   A real viewport-constrained opaque element at the top edge makes WebKit\n   use a solid edge fill instead of compositing the page through its scroll pocket. */\n.ios-scroll-edge-shield{\n  position:fixed;\n  top:0;\n  left:0;\n  right:0;\n  height:2px;\n  background:var(--bg);\n  z-index:2147483646;\n  pointer-events:none;\n}\n'''
          if '.ios-scroll-edge-shield{' not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          marker='<body class="theme-cedar font-system">'
          el='\n<div class="ios-scroll-edge-shield" aria-hidden="true"></div>'
          if 'class="ios-scroll-edge-shield"' not in s:
              if marker not in s: raise SystemExit('body marker not found')
              s=s.replace(marker,marker+el,1)
          p.write_text(s)
          PY
          grep -q 'class="ios-scroll-edge-shield"' index.html
          grep -q '\.ios-scroll-edge-shield{' index.html
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-ios27-scroll-edge.yml
          git add index.html .github/workflows/fix-ios27-scroll-edge.yml
          git commit -m 'Fix iOS 27 top scroll-edge blur'
          git push